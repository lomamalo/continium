[package]
authors = ["Malo Lemoine"]
name = "passerelle-daemon"
version = "0.1.0"
edition = "2021"
# Discovered by actually building this crate: apt's default rustc on
# Ubuntu 24.04 (1.75) fails because a transitive dependency (unescaper,
# pulled in by tungstenite) requires edition2024. Use rustc/cargo >= 1.80
# (e.g. `apt install rustc-1.80 cargo-1.80`, or your distro's current
# stable). Verified building cleanly (debug + release, zero warnings)
# with rustc/cargo 1.91.
rust-version = "1.80"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serialport = "4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "passerelle-daemon"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
